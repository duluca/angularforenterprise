name: publish

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            -t expertlysimple/angularforenterprise:latest \
            -t expertlysimple/angularforenterprise:${{ github.sha }} \
            .
          docker push expertlysimple/angularforenterprise:latest
          docker push expertlysimple/angularforenterprise:${{ github.sha }}
